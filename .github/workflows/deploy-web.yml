name: Test & Deploy Web Companion to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python test dependency
        run: python -m pip install "Pillow==11.2.1"
      - name: Run Python & JS verification tests
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s tests -v
          node --check static/app.js
          node --check static/fleet.js
          node --check static/tech-overview.js
          node --check static/tech-route.js
          node --check static/web-runtime.js
          node --check static/web-worker.js
          node tests/test_v16_pins.js
          node tests/test_v161_fleet.js
          node tests/test_v161_tech_overview.js
          node tests/test_v164_fleet_finder.js
          node tests/test_v164_tech_route_ui.js
      - name: Build static web companion
        run: python scripts/build_web.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
