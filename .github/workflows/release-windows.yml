name: Build & Publish Windows Release (.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.6.4)"
        required: true
        default: "v1.6.4"
        type: string

permissions:
  contents: read

concurrency:
  group: "release-windows-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python unit tests
        shell: pwsh
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build StellarisGuide.exe and portable zip
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name StellarisGuide `
            --icon "static\assets\stellaris-guide.ico" `
            --add-data "static;static" `
            --add-data "stellaris_guide\playbooks.json;stellaris_guide" `
            --add-data "stellaris_guide\guide_knowledge.json;stellaris_guide" `
            --distpath "dist\release-1.6.4" `
            --workpath "build\StellarisGuide-1.6.4" `
            app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_windows_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged executable contents and generate SHA256SUMS
        shell: pwsh
        run: |
          @'
          import hashlib, pathlib, zipfile
          from PyInstaller.archive.readers import CArchiveReader

          exe = pathlib.Path("dist/release-1.6.4/StellarisGuide.exe")
          zip_path = pathlib.Path("dist/StellarisGuide-Windows-1.6.4.zip")
          assert exe.is_file() and zip_path.is_file()

          reader = CArchiveReader(str(exe))
          toc = set(reader.toc.keys())
          for rel in ("stellaris_guide/guide_knowledge.json", "stellaris_guide/playbooks.json", "static/app.js", "static/app.css"):
              assert rel in toc or rel.replace("/", "\\") in toc, f"Missing data: {rel}"

          pyz = reader.open_embedded_archive("PYZ.pyz")
          pyz_toc = set(pyz.toc.keys())
          for mod in ("stellaris_guide.traditions_data", "stellaris_guide.guide_topics", "stellaris_guide.advice"):
              assert mod in pyz_toc, f"Missing module: {mod}"

          with zipfile.ZipFile(zip_path) as zf:
              assert zf.testzip() is None
              assert "StellarisGuide.exe" in zf.namelist()

          lines = []
          for path in (zip_path, exe):
              h = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{h}  {path.name}")
          pathlib.Path("dist/SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stellaris-guide-windows
          path: |
            dist/StellarisGuide-Windows-1.6.4.zip
            dist/release-1.6.4/StellarisGuide.exe
            dist/SHA256SUMS.txt

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download built Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: stellaris-guide-windows
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid release tag format: $TAG (expected e.g. v1.6.4)" >&2
            exit 1
          fi
          ZIP_FILE="$(find release-assets -name 'StellarisGuide-Windows-*.zip' -print -quit)"
          EXE_FILE="$(find release-assets -name 'StellarisGuide.exe' -print -quit)"
          SUM_FILE="$(find release-assets -name 'SHA256SUMS.txt' -print -quit)"
          test -f "$ZIP_FILE" && test -f "$EXE_FILE" && test -f "$SUM_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_FILE" "$EXE_FILE" "$SUM_FILE" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ZIP_FILE" "$EXE_FILE" "$SUM_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Stellaris Guide $TAG (Windows)" \
              --notes 'Portable Windows build (`StellarisGuide-Windows-1.6.4.zip`), standalone `StellarisGuide.exe`, and `SHA256SUMS.txt`. Extract the zip and double-click `StellarisGuide.exe`.' \
              --generate-notes
          fi
